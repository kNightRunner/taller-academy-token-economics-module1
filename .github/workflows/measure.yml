name: Measure token economics lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tokenizer
        run: python -m pip install -r requirements.txt
      - name: Count five real source text samples
        run: python count_tokens.py
      - name: Finalize measured submission
        run: python finalize_submission.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish actual counts and written submission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/token_counts.json SUBMISSION.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish measured token counts'
            git push origin HEAD:main
          fi
